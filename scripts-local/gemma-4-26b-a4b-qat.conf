# ==============================================================================
# Model: Gemma-4-26B-A4B-IT-QAT-UD (Q4_K_XL, KV Cache in VRAM)
# Optimized for: 16GB RTX 4070 Ti Super | AMD 7950X3D | 64GB DDR5 RAM
# Architecture: MoE (26B params, 4 active experts) | Q4_K_XL quantization
# KV Strategy: KV cache in VRAM via --kv-offload (default), q4_0 precision
# ==============================================================================

SERVICE_NAME="llama-gemma-4-26b-qat.service"
# MODEL_PATH="/home/siva/models/gemma-4-26b-a4b-qat/unsloth/gemma-4-26b-a4b-qat/gemma-4-26B-A4B-it-qat-UD-Q4_K_XL.gguf"
# MMPRJ_PATH="/home/siva/models/gemma-4-26b-a4b-qat/unsloth/gemma-4-26b-a4b-qat/mmproj-F16.gguf"
 MODEL_PATH="/home/siva/models/HauhauCS/Gemma4-26B-A4B-QAT-Uncensored-HauhauCS-Balanced-MTP/Gemma4-26B-A4B-QAT-Uncensored-HauhauCS-Balanced-Q4_K_M.gguf"
 MMPRJ_PATH="/home/siva/models/HauhauCS/Gemma4-26B-A4B-QAT-Uncensored-HauhauCS-Balanced-MTP/mmproj-Gemma4-26B-A4B-QAT-Uncensored-HauhauCS-Balanced-BF16.gguf"
MODEL_ALIAS="Gemma4-26B"

# --- COMPUTE ---
# Cross-CCD string for maximum single-model burst performance
CPU_AFFINITY="0-7"  # 16 threads on CCD0 and CCD2 (AMD 7950X3D)
THREADS=8
THREADS_BATCH=8
N_GPU_LAYERS=999
# 14 MOE layers on CPU to free VRAM for q4_0 KV cache, 16 layers on GPU
N_CPU_MOE=12
BATCH_SIZE=2048
UBATCH_SIZE=512
MLOCK=false
MMAP=false
FLASH_ATTN=on
NUMA=isolate
MMPRJ_OFFLOAD=false
LOG_DISABLE=true

# --- MEMORY (KV in VRAM, q4_0 Precision, 256K Context) ---
# KV cache allocated on GPU (default kv-offload), q4_0 for VRAM efficiency
CACHE_TYPE_K="q4_0"
CACHE_TYPE_V="q4_0"
CTX_SIZE=262144  # 256K total context
PARALLEL=4       # Four independent conversation slots
PORT=8080

# --- KV CACHE & PROMPT RETENTION ---
# KV_OFFLOAD=true (default) — KV cache goes to GPU with model layers
# kv-unified=true required for --cache-idle-slots (saves idle slots to RAM prompt cache)
KV_OFFLOAD=true
KV_UNIFIED=true
CACHE_RAM=24576   # 24 GB prompt cache for multi-turn retention
CACHE_IDLE_SLOTS=true # Auto-save idle slots to prompt cache
CONTEXT_SHIFT=true    # Shift context on slot reuse
SLOT_SAVE_PATH="/home/siva/.cache/llama-slots"  # SSD persistence via /slots/save API
CONT_BATCHING=true    # Continuous batching for throughput

# --- INFRASTRUCTURE ---
JINJA=true
#JINJA_KWARGS='{"preserve_thinking": true}'

TEMP=0.6
TOP_P=0.9
TOP_K=64
MIN_P=0.05
REPEAT_PENALTY=1.1

# --- REASONING ---
REASONING="on"
REASONING_FORMAT="auto"
REASONING_BUDGET=-1
REASONING_BUDGET_MESSAGE=" [Logic Finalized] "

# --- UI/UX STANDARDS ---
# Balanced MTP for 16GB: Reduced depth and quantized draft cache
EXTRA_ARGS="--model-draft /home/siva/models/HauhauCS/Gemma4-26B-A4B-QAT-Uncensored-HauhauCS-Balanced-MTP/mtp-gemma-4-26B-A4B-it.gguf --spec-type draft-mtp --api-key omlx-Manage43NrtAdmin320"
