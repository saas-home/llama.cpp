# ==============================================================================
# Model: KAT-Coder-V2.5 (Service: llama-kat)
# Source: mudler/KAT-Coder-V2.5-Dev-APEX-GGUF
# Qwen-based MoE, ~35B params, APEX-I balanced quant
# ==============================================================================

SERVICE_NAME="llama-kat.service"
MODEL_PATH="/home/siva/models/mudler/KAT-Coder-V2.5-Dev-APEX-GGUF/KAT-Coder-V2.5-Dev-APEX-I-Balanced.gguf"
MMPRJ_PATH=""
MODEL_ALIAS="KAT-Coder-V2.5"

# --- COMPUTE (CCD0 Focus) ---
# Pin to V-Cache cores (CCD0) for low-latency reasoning
CPU_AFFINITY="0-7,16-23"
THREADS=8
THREADS_BATCH=8
N_GPU_LAYERS=999
N_CPU_MOE=22
UBATCH_SIZE=1024
MLOCK=false
FLASH_ATTN=on
NUMA=isolate
MMPRJ_OFFLOAD=true
LOG_DISABLE=true

# --- MEMORY (KV in VRAM, 128K Context window) ---
# Hybrid architecture keeps KV cache footprint extremely light
CACHE_TYPE_K="q8_0"
CACHE_TYPE_V="q4_0"
CTX_SIZE=262144 
PARALLEL=3
PORT=8080

# --- KV CACHE & PROMPT RETENTION ---
KV_OFFLOAD=true
KV_UNIFIED=true
CACHE_RAM=24576
CACHE_IDLE_SLOTS=true
CONTEXT_SHIFT=false
SLOT_SAVE_PATH="/home/siva/.cache/llama-slots/kat-coder-v2.5"  # SSD persistence via /slots/save API
CONT_BATCHING=true

# --- INFRASTRUCTURE ---
JINJA=true
JINJA_KWARGS='{"preserve_thinking": true}'

# --- REASONING ---
REASONING="auto"
REASONING_FORMAT="auto"
REASONING_BUDGET=-1
REASONING_BUDGET_MESSAGE=" [Logic Finalized] "

# --- SAMPLING (Official Qwythos Specs) ---
TEMP=0.7
TOP_P=0.8
TOP_K=20
PRESENCE_PENALTY=1.5

# --- UI/UX STANDARDS ---
# --- CUSTOM CHAT TEMPLATE FOR ANTHROPIC API COMPATIBILITY ---
#EXTRA_ARGS="--chat-template-file /home/siva/github-sources/llama.cpp/scripts-local/Qwen3.5-Ornith.jinja"
