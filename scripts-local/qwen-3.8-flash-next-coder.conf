# ==============================================================================
# Model: Qwen3.8-Flash-Next-GSQ-RCO-Coder (512 routed experts MoE, multimodal)
# Repository: ISTA-DASLab/Qwen3.8-Flash-Next-GSQ-RCO-Coder-GGUF
# Target Hardware: Apple M1 Max (32-core GPU | 400 GB/s bandwidth | 64GB Unified RAM)
# CPU Topology: 8 Performance cores (P-cores) + 2 Efficiency cores (E-cores)
# Mode: LAZY_MODE="off" (Full RAM residency: all 59.3 GB weights in memory)
# ==============================================================================

SERVICE_NAME="llama-qwen3.8-flash-next-coder"

# Model paths (Shard 1 automatically loads Shard 2 from the same directory)
MODEL_PATH="/Users/localadmin/model_dir/Qwen3.8-Flash-Next-GSQ-RCO-Coder-GGUF/IQ1_M/Qwen3.8-Flash-Next-GSQ-RCO-IQ1_M-00001-of-00002.gguf"
MMPRJ_PATH="/Users/localadmin/model_dir/Qwen3.8-Flash-Next-GSQ-RCO-Coder-GGUF/mmproj-Qwen3.8-Flash-Next-BF16.gguf"
MODEL_ALIAS="Qwen3.8-Flash-Next-Coder"

# --- COMPUTE (M1 Max: 8 P-Cores Exclusive, avoid E-Core sync stall) ---
THREADS=8
THREADS_BATCH=8
FLASH_ATTN="on"

# --- GPU & MEMORY (32-Core Metal GPU | 64GB Unified Pool) ---
N_GPU_LAYERS=999
N_CPU_MOE=0
MMPRJ_OFFLOAD=true

# Memory mapping: mmap must be ON for lazy-mode to keep n-gram tables on SSD
MMAP=true
MLOCK=false

# KV Cache (q4_0 enables full 256K native context to fit within 64GB physical RAM)
CACHE_TYPE_K="q4_0"
CACHE_TYPE_V="q4_0"
CTX_SIZE=262144
PARALLEL=1
KV_UNIFIED="true"
CACHE_RAM=8192
CACHE_REUSE=256
CONTEXT_SHIFT="true"
CACHE_IDLE_SLOTS="true"

# Saturated GEMM prefill for 32-core GPU
BATCH_SIZE=2048
UBATCH_SIZE=1024

PORT=8080
HOST="0.0.0.0"

# --- SPECULATIVE DECODING (Zero-VRAM Code-Optimized N-Gram Engine) ---
# In code, functions, variable names, syntax blocks, and imports repeat constantly.
# - SPEC_TYPE="ngram-mod": highly optimized hash table lookup in history.
# - SPEC_DRAFT_N_MAX=8: drafts up to 8 tokens for boilerplate, loops, and signatures.
# - SPEC_DRAFT_N_MIN=2: allows drafting short 2-token constructs (operators, keywords).
# - EXTRA_ARGS adds --spec-ngram-mod-n-match 16 to trigger matches on shorter code prefixes.
SPEC_TYPE="ngram-mod"
SPEC_DRAFT_N_MAX=8
SPEC_DRAFT_N_MIN=2

# --- REASONING / THINKING ---
REASONING="auto"
REASONING_FORMAT="auto"
REASONING_EFFORT="medium"
REASONING_PRESERVE="false"
REASONING_BUDGET_MESSAGE=" [Logic Finalized] "
JINJA=true

# --- SAMPLING & ANTI-LOOP MECHANICS (Clean Model-Native Mode) ---
# Omit CLI sampling parameters so llama-server natively inherits the model's
# exact GGUF metadata without external filter distortion.
TEMP=""
TOP_P=""
TOP_K=""
MIN_P=""
REPEAT_PENALTY=""
REPEAT_LAST_N=""
DRY_MULTIPLIER=""
DRY_BASE=""
DRY_ALLOWED_LENGTH=""
DRY_PENALTY_LAST_N=""
SAMPLERS=""

# --- ENGINE OPTIMIZATIONS ---
# LAZY_MODE="on": keeps 27GB n-gram tables on SSD, leaving ~30GB RAM headroom for 256K context
LAZY_MODE="on"
BACKEND_SAMPLING="true"
EXTRA_ARGS="--spec-ngram-mod-n-match 16 --spec-ngram-mod-n-min 2 --spec-ngram-mod-n-max 8"
