# ==============================================================================
# Model: Qwen3.8-Flash-Next-GSQ-RCO-Q2_0 (512 routed experts MoE, multimodal)
# Repository: ISTA-DASLab/Qwen3.8-Flash-Next-GSQ-RCO-GGUF
# Target Hardware: Apple M1 Max (32-core GPU | 400 GB/s bandwidth | 64GB Unified RAM)
# CPU Topology: 8 Performance cores (P-cores) + 2 Efficiency cores (E-cores)
# Context: Full Native 256K Context (262,144 tokens) with q4_0 KV Cache
# ==============================================================================

SERVICE_NAME="llama-qwen3.8-flash-next"

# Model paths
MODEL_PATH="/Users/localadmin/github-sources/ds4/gguf/Qwen3.8-Flash-Next-Q2.gguf"
MMPRJ_PATH="/Users/localadmin/github-sources/ds4/gguf/mmproj-Qwen3.8-Flash-Next-Q8_0.gguf"
MODEL_ALIAS="Qwen3.8-Flash-Next"

# --- COMPUTE (M1 Max: 8 P-Cores Exclusive, avoid E-Core sync stall) ---
THREADS=8
THREADS_BATCH=8
FLASH_ATTN="on"

# --- GPU & MEMORY (32-Core Metal GPU | 64GB Unified Pool) ---
N_GPU_LAYERS=999
MMPRJ_OFFLOAD=true

# Memory mapping: mmap must be ON for lazy-mode to keep shard/n-gram tables on SSD
MMAP=true
MLOCK=false

# KV Cache (q4_0 enables 256K native context to fit within 64GB physical RAM)
CACHE_TYPE_K="q4_0"
CACHE_TYPE_V="q4_0"
CTX_SIZE=262144
PARALLEL=1
KV_UNIFIED="true"
CACHE_RAM=8192
CACHE_REUSE=256
CONTEXT_SHIFT="true"
CACHE_IDLE_SLOTS="true"

# Saturated GEMM prefill for 32-core GPU
BATCH_SIZE=2048
UBATCH_SIZE=1024

PORT=8080
HOST="0.0.0.0"

# --- SPECULATIVE DECODING (Hybrid: Native MTP + N-Gram Lookahead) ---
SPEC_TYPE="draft-mtp"
SPEC_DRAFT_N_MAX=3
SPEC_DRAFT_N_MIN=1
SPEC_DRAFT_P_MIN=0.75

# --- REASONING / THINKING ---
REASONING="auto"
REASONING_FORMAT="auto"
REASONING_EFFORT="medium"
REASONING_PRESERVE="false"
REASONING_BUDGET_MESSAGE=" [Logic Finalized] "
JINJA=true

# --- SAMPLING & ANTI-LOOP MECHANICS (Clean Model-Native Mode) ---
# Omit CLI sampling parameters so llama-server natively inherits the model's
# exact GGUF metadata without external filter distortion.
TEMP=""
TOP_P=""
TOP_K=""
MIN_P=""
REPEAT_PENALTY=""
REPEAT_LAST_N=""
DRY_MULTIPLIER=""
DRY_BASE=""
DRY_ALLOWED_LENGTH=""
DRY_PENALTY_LAST_N=""
SAMPLERS=""

# --- ENGINE OPTIMIZATIONS ---
# 1. LAZY_MODE="on": keeps n-gram tables on SSD to maintain resident memory under wired limit
# 2. BACKEND_SAMPLING="true": performs sampling on Metal GPU to eliminate CPU sync overhead
LAZY_MODE="on"
BACKEND_SAMPLING="true"
EXTRA_ARGS=""
