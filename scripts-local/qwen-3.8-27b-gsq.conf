# ==============================================================================
# Model: Qwen3.8-27B-GSQ-RCO (Service: llama-qwen3.8-27b)
# Architecture: Qwen3.5 Dense 27B (65 layers, Gated Attention, 256K native context)
# Hardware: RTX 4070 Ti Super (16GB VRAM) | AMD Ryzen 9 7950X3D | 64GB DDR5 RAM
# ==============================================================================

SERVICE_NAME="llama-qwen3.8-27b.service"

MODEL_PATH="/home/siva/models/ISTA-DASLab/Qwen3.8-27B-GSQ-RCO-GGUF/Qwen3.8-27B-GSQ-RCO-IQ3_XXS.gguf"
MMPRJ_PATH="/home/siva/models/ISTA-DASLab/Qwen3.8-27B-GSQ-RCO-GGUF/mmproj-Qwen3.8-27B-BF16.gguf"
#MMPRJ_PATH=""
MODEL_ALIAS="Qwen3.8-27B"

# --- COMPUTE (AMD 7950X3D Optimization) ---
# Cross-CCD string for maximum single-model burst performance
CPU_AFFINITY="0-7,24-31"
THREADS=16
THREADS_BATCH=16
THREADS_HTTP=4
PRIORITY=2
PRIORITY_BATCH=1
NUMA="isolate"
FLASH_ATTN="on"

# --- GPU & MEMORY (16GB RTX 4070 Ti Super) ---
N_GPU_LAYERS=999
N_CPU_MOE=0
MMPRJ_OFFLOAD=false  # Vision in RAM to maximize GPU VRAM for compute

# KV cache quantization (q8_0 near-lossless precision for long context)
CACHE_TYPE_K="q8_0"
CACHE_TYPE_V="q8_0"

# Context & Parallelism
# 144K tokens (147,456) resident in GPU VRAM (~90.4% VRAM use)
CTX_SIZE=147456
PARALLEL=1
PORT=8080

# --- KV CACHE & PROMPT RETENTION ---
# KV_OFFLOAD=true keeps entire 144K context in GPU VRAM for maximum decode & attention speed
KV_OFFLOAD="true"
CACHE_RAM=32768
CACHE_REUSE=256
KV_UNIFIED="true"
CACHE_IDLE_SLOTS="true"
CONTEXT_SHIFT="true"
SLOT_SAVE_PATH="/home/siva/.cache/llama-slots"
CONT_BATCHING="true"

# High-throughput batching for rapid large file ingestion (prompt prefill)
BATCH_SIZE=2048
UBATCH_SIZE=1024
MLOCK=true
MMAP=true
LOG_DISABLE=false

# --- REASONING / THINKING ---
REASONING="auto"
REASONING_FORMAT="auto"
REASONING_BUDGET=-1
REASONING_BUDGET_MESSAGE=" [Logic Finalized] "
JINJA=true

# --- SAMPLING MECHANICS (Code & Large File Optimized) ---
TEMP=0.50
MIN_P=0.05
TOP_P=0.95
TOP_K=20
REPEAT_PENALTY=1.00
REPEAT_LAST_N=0
PRESENCE_PENALTY=0.0

# DRY Sampler (prevents repetitive loops without harming code syntax)
DRY_MULTIPLIER=0.8
DRY_BASE=1.75
DRY_ALLOWED_LENGTH=3
DRY_PENALTY_LAST_N=4096

SAMPLERS="dry;top_k;top_p;min_p;temperature"

EXTRA_ARGS=""
