# ==============================================================================
# Model: Ornith-1.0-35B (Service: llama-ornith)
# Source: deepreinforce-ai/Ornith-1.0-35B-GGUF (MIT)
# Qwen-based MoE, ~35B params, APEX-I balanced quant
# ==============================================================================

SERVICE_NAME="llama-ornith.service"
MODEL_PATH="/home/siva/models/mudler/Ornith-1.0-35B/Ornith-1.0-35B-APEX-I-Balanced.gguf"
MMPRJ_PATH="/home/siva/models/mudler/Ornith-1.0-35B/mmproj.gguf"
MODEL_ALIAS="Ornith35B"

# --- COMPUTE ---
# Cross-CCD string for maximum single-model burst performance
CPU_AFFINITY="0-7"  # 16 threads on CCD0 and CCD2 (AMD 7950X3D)
THREADS=8
THREADS_BATCH=8
N_GPU_LAYERS=999
# 26 MOE layers on CPU to free VRAM for q4_0 KV cache, 14 layers on GPU
N_CPU_MOE=24
BATCH_SIZE=2048
UBATCH_SIZE=1024
MLOCK=true
FLASH_ATTN=on
NUMA=isolate
MMPRJ_OFFLOAD=false
LOG_DISABLE=true

# --- MEMORY (KV in VRAM, q4_0 Precision, 256K Context) ---
# KV cache allocated on GPU (default kv-offload), q4_0 for VRAM efficiency
CACHE_TYPE_K="q8_0"
CACHE_TYPE_V="q8_0"
CTX_SIZE=262144  # 256K total context
PARALLEL=4       # Two independent conversation slots
PORT=8080

# --- KV CACHE & PROMPT RETENTION ---
# KV_OFFLOAD=true (default) — KV cache goes to GPU with model layers
# kv-unified=true required for --cache-idle-slots (saves idle slots to RAM prompt cache)
KV_OFFLOAD=true
KV_UNIFIED=true
CACHE_RAM_MIB=24576   # 24 GB prompt cache for multi-turn retention
CACHE_IDLE_SLOTS=true # Auto-save idle slots to prompt cache
CONTEXT_SHIFT=true    # Shift context on slot reuse
SLOT_SAVE_PATH="/home/siva/.cache/llama-slots"  # SSD persistence via /slots/save API
CONT_BATCHING=true    # Continuous batching for throughput

# --- INFRASTRUCTURE ---
JINJA=true
JINJA_KWARGS='{"preserve_thinking": true}'

# --- SAMPLING (Calibrated for APEX-I-Balanced MoE) ---
TEMP=1.0
TOP_P=0.95
TOP_K=20
# MIN_P=0.05
# REPEAT_PENALTY=1.05
# REPEAT_LAST_N=256

# # --- DRY SAMPLER (Prevents MoE repetition loops) ---
# DRY_MULTIPLIER=0.8
# DRY_BASE=1.75
# DRY_ALLOWED_LENGTH=2
# DRY_PENALTY_LAST_N=4096
# SAMPLERS="dry;top_k;top_p;min_p;temperature"


# --- REASONING ---
REASONING="on"
REASONING_FORMAT="auto"
REASONING_BUDGET=-1
REASONING_BUDGET_MESSAGE=" [Logic Finalized] "

# --- UI/UX STANDARDS ---
# --- CUSTOM CHAT TEMPLATE FOR ANTHROPIC API COMPATIBILITY ---
EXTRA_ARGS="--chat-template-file /home/siva/github-sources/llama.cpp/scripts-local/Qwen3.5-Ornith.jinja"
