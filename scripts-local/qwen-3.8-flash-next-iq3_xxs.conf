# ==============================================================================
# Model: Qwen3.8-Flash-Next-GSQ-RCO-IQ3_XXS (512 routed experts MoE, multimodal)
# Repository: ISTA-DASLab/Qwen3.8-Flash-Next-GSQ-RCO-GGUF/tree/main/IQ3_XXS
# Target Hardware: Apple M1 Max (32-core GPU | 400 GB/s bandwidth | 64GB Unified RAM)
# CPU Topology: 8 Performance cores (P-cores) + 2 Efficiency cores (E-cores)
# Context: Full Native 256K Context (262,144 tokens) with q4_0 KV Cache
# ==============================================================================

SERVICE_NAME="llama-qwen3.8-flash-next-iq3"

# Model paths (Shard 1 automatically loads Shard 2 from the same directory)
MODEL_PATH="/Users/localadmin/model_dir/Qwen3.8-Flash-Next-GSQ-RCO-abliterated-GGUF/IQ3_XXS/IQ3_XXS/Qwen3.8-Flash-Next-GSQ-RCO-abliterated-IQ3_XXS-00001-of-00002.gguf"
MMPRJ_PATH="/Users/localadmin/model_dir/Qwen3.8-Flash-Next-GSQ-RCO-Coder-GGUF/mmproj-Qwen3.8-Flash-Next-BF16.gguf"
MODEL_ALIAS="Qwen3.8-Flash-Next-IQ3_XXS"

# --- COMPUTE (M1 Max: 8 P-Cores Exclusive, avoid E-Core sync stall) ---
THREADS=8
THREADS_BATCH=8
FLASH_ATTN="on"

# --- GPU & MEMORY (32-Core Metal GPU | 64GB Unified Pool) ---
N_GPU_LAYERS=999
MMPRJ_OFFLOAD=true

# Memory mapping: mmap must be ON for lazy-mode to keep shard 2 on SSD
MMAP=true
MLOCK=false

# KV Cache (q4_0 enables 256K native context to fit within 64GB physical RAM)
CACHE_TYPE_K="q4_0"
CACHE_TYPE_V="q4_0"
CTX_SIZE=262144
PARALLEL=1
KV_UNIFIED="true"
CACHE_RAM=8192
CACHE_REUSE=256
CONTEXT_SHIFT="true"
CACHE_IDLE_SLOTS="true"

# Saturated GEMM prefill for 32-core GPU
BATCH_SIZE=2048
UBATCH_SIZE=1024

PORT=8080
HOST="0.0.0.0"

# --- REASONING / THINKING ---
REASONING="auto"
REASONING_FORMAT="auto"
REASONING_EFFORT="medium"
REASONING_PRESERVE="false"
REASONING_BUDGET_MESSAGE=" [Logic Finalized] "
JINJA=true

# --- SAMPLING & ANTI-LOOP MECHANICS ---
TEMP=0.7
TOP_P=0.95
TOP_K=20
MIN_P=0.05
REPEAT_PENALTY=1.05
# REPEAT_LAST_N=256

# DRY Sampler (prevents MoE reasoning repetition loops)
# DRY_MULTIPLIER=0.8
# DRY_BASE=1.75
# DRY_ALLOWED_LENGTH=2
# DRY_PENALTY_LAST_N=4096
# SAMPLERS="dry;top_k;min_p;temperature"

# --- ENGINE OPTIMIZATIONS ---
# 1. LAZY_MODE="on": keeps 27 GB n-gram table on SSD to keep RAM footprint ~40-48 GB
# 2. BACKEND_SAMPLING="true": performs sampling on Metal GPU to eliminate CPU sync overhead
LAZY_MODE="on"
BACKEND_SAMPLING="true"
EXTRA_ARGS=""
