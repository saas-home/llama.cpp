# ==============================================================================
# Model: Qwen3.6-35B-A3B (APEX-MTP-I-Balanced)
# Optimized for: 16GB RTX 4070 Ti Super | AMD 7950X3D
# Architecture: Hybrid MoE (256 experts, 8 active) + Gated DeltaNet
# ==============================================================================

SERVICE_NAME="llama-qwen3.6-35b.service"
MODEL_PATH="/home/siva/models/Qwen3.6-35B-A3B/mudler/Carnice-Qwen3.6-MoE-35B-A3B-APEX-MTP-I-Balanced.gguf"
MMPRJ_PATH=""
MODEL_ALIAS="Q36-Coder"

# --- COMPUTE (Mixed Affinity per GEMINI.md) ---
# Cross-CCD string for maximum single-model burst performance
CPU_AFFINITY="0-31"
THREADS=16
THREADS_BATCH=16
N_GPU_LAYERS=999
# N_CPU_MOE=30: Increased safety margin for 16GB VRAM
N_CPU_MOE=32
BATCH_SIZE=2048
UBATCH_SIZE=1024
MLOCK=true
FLASH_ATTN=on
NUMA=isolate
MMPRJ_OFFLOAD=false
LOG_DISABLE=false

# --- MEMORY (Hybrid Precision Mandate) ---
# Q8_0 Keys (precision for DeltaNet) and Q4_0 Values (VRAM savings)
CACHE_TYPE_K="q4_0"
CACHE_TYPE_V="q4_0"
CTX_SIZE=524288 # 200K per session context limit
PARALLEL=2      # Focused single-stream reasoning
PORT=8080

# --- INFRASTRUCTURE ---
JINJA=true
JINJA_KWARGS='{"preserve_thinking": true}'


# --- REASONING ---
REASONING="on"
REASONING_FORMAT="auto"
REASONING_BUDGET=4096
REASONING_BUDGET_MESSAGE=" [Logic Finalized] "

# --- UI/UX STANDARDS ---
# Balanced MTP for 16GB: Reduced depth and quantized draft cache
EXTRA_ARGS="--spec-type draft-mtp --spec-draft-n-max 3"
