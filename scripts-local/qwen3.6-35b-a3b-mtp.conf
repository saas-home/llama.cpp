# ==============================================================================
# Model: Qwen3.6-35B-A3B (APEX-MTP-I-Balanced)
# Optimized for: 16GB RTX 4070 Ti Super | AMD 7950X3D
# Architecture: Hybrid MoE (256 experts, 8 active) + Gated DeltaNet
# ==============================================================================

SERVICE_NAME="llama-qwen3.6-35b.service"
MODEL_PATH="/home/siva/models/mudler/Qwopus3.6-35B-A3B-Coder-APEX-MTP-GGUF/Qwopus3.6-35B-A3B-Coder-APEX-MTP-I-Balanced.gguf"
MMPRJ_PATH="/home/siva/models/mudler/Qwopus3.6-35B-A3B-Coder-APEX-MTP-GGUF/mmproj.gguf"
MODEL_ALIAS="Qwopus36-Coder"

# --- COMPUTE ---
# Cross-CCD string for maximum single-model burst performance
CPU_AFFINITY="0-7,24-31"  # 16 threads on CCD0 and CCD2 (AMD 7950X3D)
THREADS=16
THREADS_BATCH=16
N_GPU_LAYERS=999
N_CPU_MOE=26
BATCH_SIZE=2048
UBATCH_SIZE=1024
MLOCK=true
FLASH_ATTN=on
NUMA=isolate
MMPRJ_OFFLOAD=false
LOG_DISABLE=true

CACHE_TYPE_K="q4_0"
CACHE_TYPE_V="q4_0"
CTX_SIZE=262144
PARALLEL=4   
PORT=8080

# --- KV CACHE & PROMPT RETENTION ---
# KV_OFFLOAD=true (default) — KV cache goes to GPU with model layers
# kv-unified=true required for --cache-idle-slots (saves idle slots to RAM prompt cache)
KV_OFFLOAD=true
KV_UNIFIED=true
CACHE_RAM_MIB=24576   # 24 GB prompt cache for multi-turn retention
CACHE_IDLE_SLOTS=true # Auto-save idle slots to prompt cache
CONTEXT_SHIFT=true    # Shift context on slot reuse
SLOT_SAVE_PATH="/home/siva/.cache/llama-slots"  # SSD persistence via /slots/save API
CONT_BATCHING=true    # Continuous batching for throughput

# --- INFRASTRUCTURE ---
JINJA=true
#JINJA_KWARGS='{"preserve_thinking": true}'

# --- SAMPLING (Calibrated for APEX-I-Balanced MoE) ---
TEMP=0.90
TOP_P=0.95
TOP_K=20
# MIN_P=0.05
# REPEAT_PENALTY=1.05
# REPEAT_LAST_N=256

# # --- DRY SAMPLER (Prevents MoE repetition loops) ---
# DRY_MULTIPLIER=0.8
# DRY_BASE=1.75
# DRY_ALLOWED_LENGTH=2
# DRY_PENALTY_LAST_N=4096
# SAMPLERS="dry;top_k;top_p;min_p;temperature"


# --- REASONING ---
REASONING="on"
REASONING_FORMAT="auto"
REASONING_BUDGET=512
REASONING_BUDGET_MESSAGE=" [Logic Finalized] "

# --- UI/UX STANDARDS ---
# Balanced MTP for 16GB: Reduced depth and quantized draft cache
EXTRA_ARGS="--chat-template-file /home/siva/github-sources/llama.cpp/scripts-local/Qwen3.5-Ornith.jinja --api-key omlx-Manage43NrtAdmin320 --spec-type draft-mtp --spec-draft-n-max 3"
