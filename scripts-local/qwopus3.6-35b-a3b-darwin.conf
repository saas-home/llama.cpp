# ==============================================================================
# Model: Qwopus3.6-35B-A3B-v1 (APEX-I-Balanced)
# Optimized for: 16GB RTX 4070 Ti Super | AMD 7950X3D
# Architecture: Hybrid MoE (256 experts, 8 active) + Gated DeltaNet
# ==============================================================================

SERVICE_NAME="llama-qwopus.service"
MODEL_PATH="/home/siva/models/Qwen3.6-35B-A3B/mudler/Darwin-36B-Opus-APEX-I-Balanced.gguf"
MMPRJ_PATH=""
MODEL_ALIAS="qwopus-3.6-35b-darwin"

# --- COMPUTE (Mixed Affinity per GEMINI.md) ---
# Cross-CCD string for maximum single-model burst performance
CPU_AFFINITY="0-7,24-31"
THREADS=16
THREADS_BATCH=16
N_GPU_LAYERS=999
# N_CPU_MOE=192: Calibrated for 16GB VRAM safety with 256K context.
# Moves ~75% of the 256 sparse experts to CPU to avoid VRAM overflow.
N_CPU_MOE=36
BATCH_SIZE=2048
UBATCH_SIZE=1024
MLOCK=true
FLASH_ATTN=on
NUMA=isolate
MMPRJ_OFFLOAD=false
LOG_DISABLE=false

# --- MEMORY (Hybrid Precision Mandate) ---
# Use q4_0 for both K and V to ensure 128K+ context fits in 16GB VRAM
CACHE_TYPE_K="q8_0"
CACHE_TYPE_V="q4_0"
CTX_SIZE=131072
PARALLEL=2      # Focused single-stream reasoning
PORT=8082

# --- INFRASTRUCTURE ---
JINJA=true
# Set preserve_thinking: false to allow native C++ reasoning management (GEMINI.md)
JINJA_KWARGS='{"preserve_thinking": false}'

# --- SAMPLING (Essential Logic/Coder Chain) ---
# TEMP=0.70
# MIN_P=0.05
# TOP_K=20
# --- REFINED DRY SAMPLER (Coding/MoE Focus) ---
# DRY_MULTIPLIER=0.8
# DRY_BASE=1.75
# DRY_ALLOWED_LENGTH=2
# DRY_PENALTY_LAST_N=4096
# SAMPLERS="dry;top_k;min_p;temperature"

# --- REASONING ---
REASONING="on"
REASONING_FORMAT="deepseek"
REASONING_BUDGET=-1
REASONING_BUDGET_MESSAGE=" [Logic Finalized] "

# --- UI/UX STANDARDS ---
EXTRA_ARGS=""
