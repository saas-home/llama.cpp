# ==============================================================================
# Model: Gemma-4-12B-IT (QAT Q4_0)
# Optimized for: 16GB RTX 4070 Ti Super | AMD 7950X3D
# Architecture: Dense Transformer (12B params)
# ==============================================================================

SERVICE_NAME="llama-gemma-4-12b.service"
MODEL_PATH="/home/siva/models/gemma-4-12B-qat/unsloth/gemma-4-12B-it-qat-UD-Q4_K_XL.gguf"
MMPRJ_PATH="/home/siva/models/gemma-4-12B-qat/unsloth/mmproj-F16.gguf"
MODEL_ALIAS="Gemma4-Coder"

# --- COMPUTE ---
CPU_AFFINITY="0-7"
THREADS=16
THREADS_BATCH=16
N_GPU_LAYERS=99
BATCH_SIZE=2048
UBATCH_SIZE=1024
MLOCK=true
FLASH_ATTN=on
NUMA=isolate
MMPRJ_OFFLOAD=false
LOG_DISABLE=true

# --- MEMORY (KV in VRAM, q4_0 Precision, 256K Context) ---
CACHE_TYPE_K="q8_0"
CACHE_TYPE_V="q8_0"
CTX_SIZE=131072  # 256K total context
PARALLEL=2       # Two independent conversation slots
PORT=8080

# --- KV CACHE & PROMPT RETENTION ---
# KV_OFFLOAD=true (default) — KV cache goes to GPU with model layers
# kv-unified=true required for --cache-idle-slots (saves idle slots to RAM prompt cache)
KV_OFFLOAD=true
KV_UNIFIED=true
CACHE_RAM_MIB=24576   # 24 GB prompt cache for multi-turn retention
CACHE_IDLE_SLOTS=true # Auto-save idle slots to prompt cache
CONTEXT_SHIFT=true    # Shift context on slot reuse
SLOT_SAVE_PATH="/home/siva/.cache/llama-slots"  # SSD persistence via /slots/save API
CONT_BATCHING=true    # Continuous batching for throughput

# --- INFRASTRUCTURE ---
JINJA=true
#JINJA_KWARGS='{"preserve_thinking": true}'

TEMP=1.0
TOP_P=0.95
TOP_K=64

# --- REASONING ---
REASONING="on"
REASONING_FORMAT="auto"
REASONING_BUDGET=-1
REASONING_BUDGET_MESSAGE=" [Logic Finalized] "

EXTRA_ARGS="--model-draft /home/siva/models/gemma-4-26b-a4b-qat/unsloth/MTP/gemma-4-26B-A4B-it-Q4_0-MTP.gguf --spec-type draft-mtp --spec-draft-n-max 4"
