# ==============================================================================
# Model: Gemma-4-12B-IT (QAT Q4_0)
# Optimized for: 16GB RTX 4070 Ti Super | AMD 7950X3D
# Architecture: Dense Transformer (12B params)
# ==============================================================================

SERVICE_NAME="llama-gemma-4-12b.service"
MODEL_PATH="/home/siva/models/gemma-4-12B/google/gemma-4-12b-it-qat-q4_0.gguf"
MMPRJ_PATH="/home/siva/models/gemma-4-12B/google/mmproj-gemma-4-12b-it-qat-q4_0.gguf"
MODEL_ALIAS="Gemma4-12B"

# --- COMPUTE ---
CPU_AFFINITY="0-15"
THREADS=16
THREADS_BATCH=16
N_GPU_LAYERS=999
BATCH_SIZE=2048
UBATCH_SIZE=1024
MLOCK=true
FLASH_ATTN=on
NUMA=isolate
MMPRJ_OFFLOAD=true
LOG_DISABLE=true

# --- MEMORY ---
# Q4_0 for both K and V (VRAM savings for 256K context on 16GB GPU)
CACHE_TYPE_K="q4_0"
CACHE_TYPE_V="q4_0"
CTX_SIZE=262144
PARALLEL=2
PORT=8081

# --- INFRASTRUCTURE ---
JINJA=true
JINJA_KWARGS='{"preserve_thinking": true}'

# --- REASONING ---
REASONING="on"
REASONING_FORMAT="auto"
REASONING_BUDGET=4096
REASONING_BUDGET_MESSAGE=" [Logic Finalized] "
