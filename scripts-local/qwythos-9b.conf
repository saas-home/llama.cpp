# ==============================================================================
# Model: Qwythos-9B-Claude-Mythos-5-1M (Q8_0, Unified Vision-Language)
# Optimized for: 16GB RTX 4070 Ti Super | AMD 7950X3D | CachyOS
# Architecture: Hybrid Gated DeltaNet + Gated Attention (32 layers total)
# YaRN rope-scaling enabled (1M Context window supported)
# ==============================================================================

SERVICE_NAME="llama-qwythos-9b.service"
MODEL_PATH="/home/siva/models/empero-ai/Qwythos-9B-v2-GGUF/Qwythos-9B-v2-MTP-Q6_K.gguf"
#MMPRJ_PATH="/home/siva/models/empero-ai/Qwythos-9B-v2-GGUF/mmproj-Qwythos-9B-v2-BF16.gguf"
MMPRJ_PATH=""
MODEL_ALIAS="qwythos-9b-pro"

# --- COMPUTE (CCD0 Focus) ---
# Pin to V-Cache cores (CCD0) for low-latency reasoning
CPU_AFFINITY="0-7,16-23"
THREADS=8
THREADS_BATCH=8
N_GPU_LAYERS=999
N_CPU_MOE=0
UBATCH_SIZE=512
MLOCK=false
FLASH_ATTN=on
NUMA=isolate
MMPRJ_OFFLOAD=true
LOG_DISABLE=true

# --- MEMORY (KV in VRAM, 128K Context window) ---
# Hybrid architecture keeps KV cache footprint extremely light
CACHE_TYPE_K="q8_0"
CACHE_TYPE_V="q8_0"
CTX_SIZE=262144 
PARALLEL=6
PORT=8080

# --- KV CACHE & PROMPT RETENTION ---
KV_OFFLOAD=true
KV_UNIFIED=true
CACHE_RAM=24576
CACHE_IDLE_SLOTS=true
CONTEXT_SHIFT=false
SLOT_SAVE_PATH="/home/siva/.cache/llama-slots/qwythos-9b"  # SSD persistence via /slots/save API
CONT_BATCHING=true

# --- INFRASTRUCTURE ---
JINJA=true

# --- REASONING ---
REASONING="auto"
REASONING_FORMAT="auto"
REASONING_BUDGET=-1
REASONING_BUDGET_MESSAGE=" [Logic Finalized] "

# --- SAMPLING (Official Qwythos Specs) ---
TEMP=0.6
TOP_P=0.95
TOP_K=20
#REPEAT_PENALTY=1.05

# --- DRY SAMPLER (Prevents reasoning repetition loops) ---
# DRY_MULTIPLIER=0.8
# DRY_BASE=1.75
# DRY_ALLOWED_LENGTH=2
# DRY_PENALTY_LAST_N=4096
# SAMPLERS="dry;top_k;top_p;temperature"

EXTRA_ARGS="--spec-type draft-mtp --spec-draft-n-max 3 --image-min-tokens 1024"
